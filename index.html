<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Haiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}

body{
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#E6140F;
  color:#fff;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .65s ease;
}

.poster{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:max(18px,3vh) max(18px,4.5vw) max(14px,2.2vh);
  max-width:900px;margin:0 auto;
}

/* The haiku owns the top half. Everything else is deliberately small. */
.lines{flex:0 0 49%;min-height:0;overflow:hidden;}
.inner{display:block;}

.line{
  font-family:'Anton',Impact,'Arial Narrow',sans-serif;
  text-transform:uppercase;
  line-height:.90;
  margin-bottom:.06em;
  display:block;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1);
}
.line:last-child{margin-bottom:0;}
.line.on{opacity:1;transform:none;}

.line .em{
  display:inline-block;
  width:.56em;height:.075em;
  background:currentColor;
  vertical-align:.32em;
  margin-right:.13em;
}

/* The empty space is the design. Play happens quietly at the bottom of it. */
.space{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;}
.nextrow{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:max(9px,1.3vh);}
.controls{width:100%;}

/* The one control that carries weight, sitting under the poem on the right. */
.ghost{
  background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.42);
  color:#fff;opacity:1;
  font:600 clamp(10.5px,2.9vw,13px) 'Archivo',sans-serif;
  letter-spacing:.1em;text-transform:uppercase;
  padding:13px 22px;cursor:pointer;
  transition:background-color .2s ease,border-color .2s ease;
}
.ghost:hover{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.78);}
.ghost.gone{visibility:hidden;}
.ghost{min-width:150px;text-align:center;}
.ghost.sub{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);font-weight:500;}
.ghost.sub:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);}
.ghost.sub.hero{background:#fff;color:var(--ink,#E6140F);border-color:#fff;font-weight:600;}

/* Two rows of controls and never more, so the poem keeps every pixel of the
   height it had. The row of finishing actions takes the place the give up
   button vacates, and the era sits beside new puzzle rather than under it. */
.row{display:flex;gap:8px;min-width:0;}
#endrow{display:none;}
.nextrow.over #endrow{display:flex;}
.nextrow.over #skip{display:none;}
.ghost.sm{
  min-width:0;padding:13px 15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.status{
  font-size:clamp(8.5px,2.2vw,10.5px);
  font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  opacity:.7;margin-bottom:7px;height:1.4em;overflow:hidden;
}
.status b{font-weight:600;}

.hint{
  font-size:clamp(9.5px,2.5vw,11.5px);
  font-weight:500;letter-spacing:.055em;
  opacity:.9;margin-bottom:9px;height:1.4em;overflow:hidden;
}
.hint.gone{visibility:hidden;}

.slot{position:relative;height:clamp(76px,11.5vh,100px);}

input{
  position:absolute;bottom:0;left:0;right:0;height:52px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.45);
  color:#fff;
  font:400 16px 'Archivo',sans-serif;
  padding:0 15px;outline:none;border-radius:0;
  transition:background-color .2s ease,border-color .2s ease;
}
input:focus{background:rgba(255,255,255,.24);border-color:#fff;}
input::placeholder{color:rgba(255,255,255,.62);}

/* The reveal is the payoff, so it gets real size. */
.result{
  position:absolute;inset:0;display:none;
  flex-direction:column;justify-content:flex-end;
}
.result.on{display:flex;}
.rtitle{
  font-family:'Anton',Impact,'Arial Narrow',sans-serif;
  text-transform:uppercase;line-height:.95;
  font-size:clamp(23px,7vw,44px);
  margin-bottom:.22em;
}
.rmeta{display:flex;align-items:center;gap:11px;
  font-size:clamp(9.5px,2.5vw,12px);font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;opacity:.78;}
.marks{font:400 clamp(12px,3.2vw,15px) ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.24em;opacity:1;}

.ac{
  position:absolute;bottom:calc(100% + 5px);left:0;right:0;
  background:#fff;color:var(--ink,#E6140F);
  max-height:min(230px,32vh);overflow-y:auto;
  display:none;z-index:30;box-shadow:0 -6px 22px rgba(0,0,0,.22);
}
.ac.on{display:block;}
.ac div{
  display:flex;align-items:baseline;gap:10px;
  padding:12px 14px;cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,.09);
}
.ac div:last-child{border-bottom:0;}
.ac div:hover,.ac div.sel{background:var(--ink,#E6140F);color:#fff;}
.ac .t{
  flex:1;font-size:15px;font-weight:600;letter-spacing:-.005em;
  line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ac .y{
  font:400 12px ui-monospace,'SF Mono',Menlo,monospace;
  opacity:.5;flex:0 0 auto;letter-spacing:.02em;
}
.ac div:hover .y,.ac div.sel .y{opacity:.75;}

/* A chooser, drawn as the autocomplete is drawn, opening down into the empty
   middle rather than up across the poem. */
.menu{position:relative;display:flex;min-width:0;}
.pop{
  top:calc(100% + 5px);bottom:auto;left:auto;right:0;
  width:232px;max-width:80vw;max-height:none;
  box-shadow:0 6px 22px rgba(0,0,0,.22);
}
/* The era sits at the left of its row and the sheet at the right, so each
   list opens along its own button towards the room it has. */
#eras{left:0;right:auto;}
.pop div{padding:9px 14px;}
.pop .t{font-size:13.5px;}
/* An era with nothing in it can be read but not chosen. */
.pop .off{opacity:.4;cursor:default;}
.pop .off:hover{background:#fff;color:var(--ink,#E6140F);}

.rule{height:1.5px;background:currentColor;margin:max(12px,2vh) 0 7px;flex:0 0 auto;}

.foot{
  display:flex;justify-content:space-between;align-items:flex-start;
  font-size:clamp(8px,2.05vw,10px);
  font-weight:500;line-height:1.6;letter-spacing:.01em;
  flex:0 0 auto;
}
.foot .mark span{display:block;white-space:nowrap;}
.foot .mark i{
  display:inline-block;width:.6em;height:1px;background:currentColor;
  vertical-align:.28em;margin-right:.32em;
}
.foot .right{text-align:right;}
.foot .prog{letter-spacing:.3em;margin-bottom:.2em;}
/* The signature belongs to the poster, not to the game: on screen the reveal
   already names the film in full, so the foot stays blank and only clean view
   and print turn it on. The height is still reserved because the foot is the
   taller of its two columns, and collapsing it would move the rule, the mark
   and the input by 14px. */
.foot .ans{opacity:0;height:3.2em;overflow:hidden;}
.credit{
  flex:0 0 auto;margin-top:6px;
  font-size:clamp(7.5px,1.95vw,9.5px);font-weight:400;
  letter-spacing:.06em;opacity:.5;
}
.back{display:none;white-space:nowrap;font-weight:500;letter-spacing:.1em;text-transform:uppercase;}

/* Clean view: the interface goes and the room it was using stays empty. The
   poem keeps its 49%, which is the share the sheet gives it too, so this is
   the printed poster on a screen rather than a bigger version of the poem.
   The same rules as the print block, over the same elements, and only the box
   they are given to fill is different. */
body.bare .space>*{display:none;}
body.bare .foot .prog{display:none;}
body.bare .foot .ans{opacity:1;height:auto;overflow:visible;}
body.bare .credit{display:flex;justify-content:space-between;gap:12px;}
body.bare .back{display:block;}

/* Print geometry, held as fractions of the sheet. The type fit reads these
   too, so the measurement and the print rules cannot drift apart. */
:root{--p-pad-t:6.4%;--p-pad-x:7%;--p-pad-b:5.4%;--p-poem:49%;}

/* Paper. The same poster, measured against the page box rather than the
   viewport, which has no meaning here. Everything is scoped to body.done, so
   these rules are unreachable until the puzzle is over and the poem is whole.
   Sizes are proportional: A4 and A3 differ only by the sheet they are given. */
@media print{
  html{height:100%;}

  body.done{
    height:100%;overflow:hidden;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  /* Nothing may still be easing when the page is captured, or the poster
     prints a half faded answer. */
  body.done,body.done *{
    transition:none;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }

  body.done .poster{
    height:100%;width:100%;max-width:none;margin:0;
    padding:var(--p-pad-t) var(--p-pad-x) var(--p-pad-b);
    background-color:inherit;
    font-size:var(--p-base,13px);
  }

  body.done .lines{flex:0 0 var(--p-poem);}
  /* Beats the inline size the screen fit leaves on the element. */
  body.done .inner{font-size:var(--p-fit,72px)!important;}
  body.done .line{opacity:1;transform:none;}

  /* Everything the player used to get here: buttons, status, hint, input,
     autocomplete and the reveal block. A poster keeps none of it. */
  body.done .space>*{display:none;}

  body.done .rule{height:.14em;margin:1.6em 0 .8em;}
  body.done .foot{font-size:1em;}
  body.done .foot .prog{display:none;}
  body.done .foot .ans{opacity:1;height:auto;overflow:visible;}
  body.done .credit{font-size:.82em;margin-top:.8em;}
}
</style>
<style id="pagesize">@page{size:A4;margin:0}</style>
</head>
<body>

<div class="poster">

  <div class="lines" id="lines">
    <div class="inner" id="inner">
      <span class="line" id="l0"></span>
      <span class="line" id="l1"></span>
      <span class="line" id="l2"></span>
    </div>
  </div>

  <div class="space">
    <div class="nextrow" id="nextrow">
      <div class="row" id="endrow">
        <button class="ghost sub sm" id="clean">Clean view</button>
        <div class="menu">
          <button class="ghost sub sm" id="poster">Save as poster</button>
          <div class="ac pop" id="sizes"></div>
        </div>
      </div>
      <button class="ghost" id="skip">Next line</button>
      <div class="row">
        <div class="menu">
          <button class="ghost sub sm" id="erabtn">All decades</button>
          <div class="ac pop" id="eras"></div>
        </div>
        <button class="ghost sub" id="next">New puzzle</button>
      </div>
    </div>
    <div class="controls">
      <div class="status" id="status">Line one of three</div>
      <div class="hint" id="hint">Type a film title, then choose it from the list</div>
      <div class="slot">
        <div class="ac" id="ac"></div>
        <input id="guess" type="text" placeholder="Start typing&hellip;" autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="result" id="result">
          <div class="rtitle" id="rtitle"></div>
          <div class="rmeta">
            <span class="marks" id="marks"></span>
            <span id="rtxt"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="rule"></div>
  <div class="foot">
    <div class="mark">
      <span><i></i>Reel</span>
      <span><i></i>Haiku</span>
    </div>
    <div class="right">
      <div class="prog" id="prog">&#9633;&#9633;&#9633;</div>
      <div class="ans" id="ans"></div>
    </div>
  </div>

  <div class="credit">Created by Mike Linsey and Nathan Haslewood<span class="back">Tap anywhere to go back</span></div>

</div>

<script>

/* Content is fetched at boot, not inlined. */
let PUZZLES = [];
let FILMS = [];
let order = [], oi = 0;
let shown = 1, guesses = 0, over = false, sel = -1, matches = [];

const $ = id => document.getElementById(id);
const lineEls=[$('l0'),$('l1'),$('l2')];
const linesBox=$('lines'), inner=$('inner'), progEl=$('prog'), ansEl=$('ans'),
      statusEl=$('status'), input=$('guess'), acEl=$('ac'),
      resultEl=$('result'), marksEl=$('marks'), rtxtEl=$('rtxt'), rtitleEl=$('rtitle'),
      skipBtn=$('skip'), nextBtn=$('next'), hintEl=$('hint'),
      nextrowEl=$('nextrow'), posterBtn=$('poster'), pageEl=$('pagesize'),
      cleanBtn=$('clean'), eraBtn=$('erabtn'), eraEl=$('eras'), sizeEl=$('sizes');

const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const P = () => PUZZLES[order[oi]];
const WORD = ['one','two','three'];

/* Nothing before 1940 is ever served. Held as a rule in code rather than an
   edit to the data, so it still holds when new puzzles land. */
const FROM = 1940;

/* Difficulty here is a property of the player, not the puzzle, so the only
   honest lever is the era. The 1940s hold too few films to stand alone and so
   do the 2020s, and each is folded into its neighbour. Counts are read from
   the data, never written down. */
const ERAS = [
  ['All decades', FROM, 9999],
  ['1940s and 1950s', 1940, 1959],
  ['1960s', 1960, 1969],
  ['1970s', 1970, 1979],
  ['1980s', 1980, 1989],
  ['1990s', 1990, 1999],
  ['2000s', 2000, 2009],
  ['2010s and later', 2010, 9999]
];
let POOLS = [], era = 0;

/* Largest size at which all three lines, fully wrapped, still fit the box.
   Fitting against all three rather than the visible ones is what stops the
   layout moving as lines appear. */
function fit(){
  const h = linesBox.clientHeight, w = linesBox.clientWidth;
  if(!h || !w) return;
  let lo = 14, hi = 360;
  for(let i=0;i<20;i++){
    const mid = (lo + hi) / 2;
    inner.style.fontSize = mid + 'px';
    if(inner.scrollHeight <= h && inner.scrollWidth <= w + 1) lo = mid; else hi = mid;
  }
  inner.style.fontSize = lo + 'px';
}

function paint(){
  const z = P();
  if(!z) return;
  document.body.style.background = z.k;
  document.documentElement.style.setProperty('--ink', z.k);
  lineEls.forEach((el,i) => {
    el.innerHTML = '<span class="em"></span>' + z.l[i];
    el.classList.toggle('on', i < shown);
  });
  progEl.textContent = [0,1,2].map(i => i < shown ? '\u25A0' : '\u25A1').join('');
  skipBtn.textContent = shown === 3 ? 'Give up' : 'Next line';
  fit();
}

const say = m => statusEl.innerHTML = m;

function finish(won){
  over = true;
  const z = P();
  shown = 3; paint();
  /* Written for the poster surfaces to pick up. On screen it stays hidden. */
  ansEl.innerHTML = z.t + '<br>' + z.y;
  input.style.display = 'none';
  resultEl.classList.add('on');
  acEl.classList.remove('on');
  skipBtn.classList.add('gone');
  hintEl.classList.add('gone');
  nextBtn.classList.add('hero');
  nextrowEl.classList.add('over');
  document.body.classList.add('done');

  const marks = ['\u25A1','\u25A1','\u25A1'];
  if(won) marks[Math.min(guesses,3)-1] = '\u25A0';
  rtitleEl.textContent = z.t;
  marksEl.textContent = won ? marks.join('') : '\u2715\u2715\u2715';
  rtxtEl.textContent = z.y + (won ? '  /  Solved on line ' + WORD[guesses-1] : '  /  Beat me today');
  say(won ? 'Solved' : 'Missed');
}

function advance(label){
  if(shown === 3){ finish(false); return; }
  shown++; paint();
  say(label + `Line <b>${WORD[shown-1]}</b> of three`);
  input.value=''; acEl.classList.remove('on'); sel=-1;
}

function submit(f){
  if(over || !f) return;
  guesses++;
  const z = P();
  if(f[0] === z.t && f[1] === z.y){ finish(true); return; }
  advance(`Not ${f[0]}. `);
}

function skip(){ if(over) return; guesses++; advance(''); }

function reset(){
  oi++; if(oi >= order.length){ shuffle(order); oi = 0; }
  shown=1; guesses=0; over=false; sel=-1;
  input.style.display=''; input.value='';
  resultEl.classList.remove('on');
  skipBtn.classList.remove('gone'); hintEl.classList.remove('gone');
  nextBtn.classList.remove('hero');
  nextrowEl.classList.remove('over');
  document.body.classList.remove('done');
  ansEl.innerHTML='';
  acEl.classList.remove('on');
  paint();
  say('Line one of three');
}

/* Choosing an era reshuffles that pool and starts a fresh puzzle from it. The
   current one is left alone: filtering under a player mid guess would be a
   trick, not a setting. reset lands on the first of the new order. */
function pick(e){
  if(!POOLS[e] || !POOLS[e].length) return;
  era = e;
  eraBtn.textContent = ERAS[e][0];
  [...eraEl.children].forEach((d,i) => d.classList.toggle('sel', i === e));
  order = shuffle(POOLS[e].slice());
  oi = -1;
  reset();
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  sel = -1;
  if(q.length < 2){ acEl.classList.remove('on'); return; }
  /* Rank titles that start with the query above ones that merely contain it. */
  const starts = [], has = [];
  for(const f of FILMS){
    const l = f[0].toLowerCase();
    if(l.startsWith(q)) starts.push(f);
    else if(l.includes(q)) has.push(f);
    if(starts.length >= 8) break;
  }
  matches = starts.concat(has).slice(0,8);
  if(!matches.length){ acEl.classList.remove('on'); return; }
  acEl.innerHTML = matches.map((f,i) =>
    `<div data-i="${i}"><span class="t">${esc(f[0])}</span>` +
    `<span class="y">${f[1] || ''}</span></div>`).join('');
  acEl.classList.add('on');
});

acEl.addEventListener('click', e => {
  const d = e.target.closest('div[data-i]');
  if(d) submit(matches[+d.dataset.i]);
});

input.addEventListener('keydown', e => {
  if(!acEl.classList.contains('on')) return;
  const items = [...acEl.querySelectorAll('div')];
  if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, items.length-1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); }
  else if(e.key === 'Enter'){ e.preventDefault(); submit(matches[sel < 0 ? 0 : sel]); return; }
  else if(e.key === 'Escape'){ acEl.classList.remove('on'); return; }
  else return;
  items.forEach((el,i) => el.classList.toggle('sel', i === sel));
});

skipBtn.addEventListener('click', skip);
nextBtn.addEventListener('click', reset);

/* One chooser open at a time, and a click anywhere shuts it. */
const shut = () => { eraEl.classList.remove('on'); sizeEl.classList.remove('on'); };

const opens = (btn, list) => btn.addEventListener('click', e => {
  e.stopPropagation();
  const was = list.classList.contains('on');
  shut();
  if(was) return;
  /* As much of the list as there is room for between the button and the foot
     of the screen, so a short phone scrolls rather than losing the last era. */
  list.style.maxHeight = (innerHeight - btn.getBoundingClientRect().bottom - 24) + 'px';
  list.classList.add('on');
});
opens(eraBtn, eraEl);
opens(posterBtn, sizeEl);

eraEl.addEventListener('click', e => {
  const d = e.target.closest('div[data-e]');
  if(d && !d.classList.contains('off')) pick(+d.dataset.e);
});

/* Clean view. Nothing is added to the page and nothing is moved: one class on
   the body takes the interface away and leaves its room empty. The poem box is
   the same 49% either way, so the fit lands on the size it already had. The
   call stays so that remains true if the composition ever changes. */
let bare = false;
function clean(on){
  bare = on;
  document.body.classList.toggle('bare', on);
  fit();
}

cleanBtn.addEventListener('click', e => { e.stopPropagation(); shut(); clean(true); });
addEventListener('click', () => { shut(); if(bare) clean(false); });
addEventListener('keydown', e => { if(e.key === 'Escape' && bare) clean(false); });

/* The poster. Print only, no library and no server: the browser turns the
   finished puzzle into a PDF using the rules in the print block above. */
const MM = 96 / 25.4;                 /* CSS pixels per millimetre at 96dpi */
const SHEET = { A4:[210,297], A3:[297,420] };
let sheet = 'A4';

sizeEl.innerHTML = Object.keys(SHEET).map(k =>
  `<div data-s="${k}"><span class="t">${k}</span>` +
  `<span class="y">${SHEET[k][0]} x ${SHEET[k][1]} mm</span></div>`).join('');

/* The screen fit measures the poem against the on-screen box, which says
   nothing about a sheet of paper. Measure it again in an off-screen box the
   exact size of the poem area on the chosen sheet, so a long haiku sets
   smaller on paper for the same reason it does on screen. The real element is
   never touched, so the screen cannot move. */
function printFit(){
  const cs = getComputedStyle(document.documentElement);
  const pc = n => parseFloat(cs.getPropertyValue(n)) / 100;
  const pw = SHEET[sheet][0] * MM, ph = SHEET[sheet][1] * MM;
  const w = pw * (1 - 2 * pc('--p-pad-x'));
  const h = (ph - pw * (pc('--p-pad-t') + pc('--p-pad-b'))) * pc('--p-poem');

  /* The probe carries the lines but not the inner class, or the print rule
     that sizes the poem would size the probe measuring it as well. */
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;' +
    'overflow:hidden;width:' + w + 'px;height:' + h + 'px;';
  box.innerHTML = '<div>' + inner.innerHTML + '</div>';
  document.body.appendChild(box);
  const probe = box.firstChild;
  let lo = 14, hi = 900;
  for(let i=0;i<22;i++){
    const mid = (lo + hi) / 2;
    probe.style.fontSize = mid + 'px';
    if(probe.scrollHeight <= h && probe.scrollWidth <= w + 1) lo = mid; else hi = mid;
  }
  box.remove();

  const r = document.documentElement.style;
  r.setProperty('--p-fit', lo + 'px');
  r.setProperty('--p-base', pw * 0.017 + 'px');
}

/* The sheet and the page rule are set together, so a print raised from the
   browser can never fit one size and print on the other. */
function setSheet(s){
  sheet = s;
  pageEl.textContent = '@page{size:' + s + ';margin:0}';
}

/* Picking the sheet is the action: choose a size and the dialogue opens. */
sizeEl.addEventListener('click', async e => {
  const d = e.target.closest('div[data-s]');
  if(!d) return;
  shut();
  setSheet(d.dataset.s);
  /* Without the real face the poem is fitted to fallback metrics, and the PDF
     comes out in the wrong type at the wrong size. */
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  printFit();
  print();
});

/* Also covers a print raised from the browser itself rather than the button. */
addEventListener('beforeprint', () => { if(over) printFit(); });

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 120); });

/* Content is fetched rather than inlined, so the file stays editable and the
   same shape works for the real site.

   no-cache does not mean no caching. It means the browser must ask the server
   whether its copy is still good, and Pages answers an unchanged file with a
   304 and no body. A version in the query string only worked when somebody
   remembered to bump it, and content has already shipped stale because nobody
   did. This asks every time and costs nothing when the answer is no change. */
Promise.all([
  fetch('puzzles.json', {cache: 'no-cache'}).then(r => r.json()),
  fetch('titles.json', {cache: 'no-cache'}).then(r => r.json())
]).then(([p, t]) => {
  PUZZLES = p.puzzles.filter(z => z.y >= FROM);
  FILMS = t;
  /* Each era is bucketed once, here, so the counts in the list are read off
     the pools rather than counted again every time the list is opened. */
  POOLS = ERAS.map(([, lo, hi]) => {
    const a = [];
    PUZZLES.forEach((z, i) => { if(z.y >= lo && z.y <= hi) a.push(i); });
    return a;
  });
  eraEl.innerHTML = ERAS.map((e, i) =>
    `<div data-e="${i}"${POOLS[i].length ? '' : ' class="off"'}>` +
    `<span class="t">${e[0]}</span><span class="y">${POOLS[i].length}</span></div>`).join('');
  if(!POOLS[0].length){ say('Could not load puzzles'); return; }
  pick(0);
}).catch(() => {
  say('Could not load puzzles');
});

/* Refit once the real face loads, or the size is measured against a fallback
   with completely different metrics. */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
addEventListener('load', fit);
</script>
</body>
</html>
